<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页｜280班</title>
    <style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system}
body{background:#f7f3ec;color:#222;line-height:1.7}
.site-header{background:#2563eb;color:#fff;padding:12px 20px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.header-inner{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:24px}
.logo{font-size:22px;font-weight:600}
.site-header a{color:#fff;text-decoration:none}
.site-header a:hover{opacity:0.85}

.module-content{max-width:860px;margin:28px auto;padding:0 16px}

/* 个人信息卡片：头像左，信息右 横向布局 */
.profile-card{
    background:#ffffff;
    border-radius:18px;
    padding:28px;
    box-shadow:0 2px 14px rgba(0,0,0,0.06);
    display:flex;
    gap:24px;
    align-items:flex-start;
    margin-bottom:20px;
}
.profile-avatar{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #e2ddd4;
    flex-shrink:0;
}
.profile-info{
    flex:1;
}
.profile-info h2{
    font-size:26px;
    font-weight:600;
    margin-bottom:4px;
}
.profile-account{
    color:#555;
    margin-bottom:6px;
}
.cooling-tip{
    color:#c82423;
    margin-bottom:16px;
}

.profile-edit-area label{
    display:block;
    margin:12px 0 6px 0;
    font-weight:500;
    font-size:14px;
}
.profile-edit-area input{
    width:100%;
    max-width:320px;
    padding:10px 14px;
    border:1px solid #d1cbc2;
    border-radius:10px;
    font-size:14px;
}
.btn-group{
    margin-top:18px;
    display:flex;
    gap:12px;
}
.btn-save{
    background:#8c6c58;
    color:#fff;
    border:none;
    padding:10px 24px;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
}
.btn-back{
    background:#ece9e4;
    border:none;
    padding:10px 24px;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
}

/* Tab标签区域 */
.tab-wrap{
    background:#fff;
    border-radius:18px;
    padding:24px;
    box-shadow:0 2px 14px rgba(0,0,0,0.06);
}
.tab-header{
    display:flex;
    gap:8px;
    border-bottom:1px solid #ddd;
    margin-bottom:16px;
}
.tab-item{
    padding:10px 18px;
    cursor:pointer;
    border:none;
    background:transparent;
    font-size:16px;
}
.tab-item.active{
    background:#efe3d2;
    border-radius:8px 8px 0 0;
    font-weight:500;
}
.tab-content{
    min-height:120px;
}
.item-row{
    background:#f8f5f0;
    padding:14px 16px;
    border-radius:12px;
    margin:8px 0;
}
.empty{
    color:#888;
    text-align:center;
    padding:40px 0;
}
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <h1 class="logo">🏫280班</h1>
            <a href="index.html">← 返回首页</a>
        </div>
    </header>
    <main class="module-content">
        <div id="profileWrap"></div>

        <div class="tab-wrap" id="tabWrap" style="display:none">
            <div class="tab-header">
                <button class="tab-item active" data-tab="novel">我的小说</button>
                <button class="tab-item" data-tab="post">日常分享</button>
                <button class="tab-item" data-tab="record">投稿记录</button>
            </div>
            <div class="tab-content" id="tabContent"></div>
        </div>
    </main>

<script>
// ========== 全局公共配置（和index保持一致） =========
const SUPABASE_URL = 'https://gbktpjnitqpwomcprrol.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdia3Rwam5pdHFwd29tY3Bycm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MTk2NDIsImV4cCI6MjA5ODk5NTY0Mn0.TIp9NAdDRZrI16Jq_no7Ga9EpX7ooc6b5Ck7r-sNqww';

async function supabaseRequest(table, method = 'GET', data = null, id = null) {
    const url = id
        ? `${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`
        : `${SUPABASE_URL}/rest/v1/${table}`;
    const options = {
        method: method,
        headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json; charset=utf-8',
            'Prefer': 'return=representation'
        }
    };
    if (data && (method === 'POST' || method === 'PATCH')) {
        options.body = JSON.stringify(data);
    }
    try {
        const res = await fetch(url, options);
        if (method === 'DELETE') return { ok: true };
        const result = await res.json();
        return result;
    } catch (e) {
        console.error('Supabase 请求失败：', e);
        return [];
    }
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

let loginUser = null;
function refreshUserStatus(){
    const raw = localStorage.getItem("userInfo");
    loginUser = raw ? JSON.parse(raw) : null;
}

function getUrlParam(name){
    const params = new URLSearchParams(location.search);
    return params.get(name);
}

let viewUserId = getUrlParam("uid");
let viewUser = null;
let userNovels = [];
let userPosts = [];

async function loadProfilePage(){
    refreshUserStatus();
    const tabWrapDom = document.getElementById("tabWrap");

    if(viewUserId){
        // 查看别人主页
        const userArr = await supabaseRequest("users","GET");
        viewUser = Array.isArray(userArr) ? userArr.find(u=>u.id == viewUserId) : null;
        if(!viewUser){
            alert("找不到该用户！");
            location.href="index.html";
            return;
        }
    }else{
        // 自己主页
        if(!loginUser){
            alert("请先登录账号");
            location.href="login.html";
            return;
        }
        viewUser = loginUser;
    }

    renderProfile();
    await loadUserWorks();
    tabWrapDom.style.display="block";
    bindTabClick();
    switchTab("novel");
}

function renderProfile(){
    const isMe = viewUserId === null;
    const avatar = viewUser.avatar||"";
    const nick = escapeHtml(viewUser.nickname);

    let html=`
    <div class="profile-card">
        ${avatar ? `<img src="${avatar}" class="profile-avatar">` : "👤"}
        <div class="profile-info">
            <h2>${nick}</h2>
            <div class="profile-account">账号：${nick}</div>
    `;

    if(isMe){
        // 自己主页：显示编辑、冷却提示
        html+=`
        <div class="cooling-tip">✕ 冷却中，剩余 59天22小时，暂时无法修改资料</div>
        <div class="profile-edit-area">
            <label>新昵称</label>
            <input id="inputNick" value="${escapeHtml(viewUser.nickname)}">
            <label>头像链接</label>
            <input id="inputAvatar" value="${escapeHtml(viewUser.avatar||'')}" placeholder="粘贴图片URL">
            <div class="btn-group">
                <button class="btn-save" onclick="saveProfile()">保存修改</button>
                <button class="btn-back" onclick="location.href='index.html'">返回首页</button>
            </div>
        </div>
        `;
    }
    html+=`</div></div>`;
    document.getElementById("profileWrap").innerHTML = html;
}

async function loadUserWorks(){
    const allPosts = await supabaseRequest("posts");
    const allNovels = await supabaseRequest("novels");
    userPosts = Array.isArray(allPosts) ? allPosts.filter(p=>p.user_id===viewUser.id) : [];
    userNovels = Array.isArray(allNovels) ? allNovels.filter(n=>n.user_id===viewUser.id) : [];
}

// Tab切换
function bindTabClick(){
    document.querySelectorAll(".tab-item").forEach(el=>{
        el.onclick=()=>{
            document.querySelectorAll(".tab-item").forEach(t=>t.classList.remove("active"));
            el.classList.add("active");
            switchTab(el.dataset.tab);
        }
    })
}
function switchTab(tabName){
    const box = document.getElementById("tabContent");
    let html="";
    if(tabName==="novel"){
        if(userNovels.length>0){
            userNovels.forEach(n=> html+=`<div class="item-row">${escapeHtml(n.title)}</div>`)
        }else html=`<div class="empty">暂无小说</div>`;
    }else if(tabName==="post"){
        if(userPosts.length>0){
            userPosts.forEach(p=> html+=`<div class="item-row">${escapeHtml(p.content||"无文字内容")}</div>`)
        }else html=`<div class="empty">暂无日常分享</div>`;
    }else if(tabName==="record"){
        html=`<div class="empty">投稿记录开发中</div>`;
    }
    box.innerHTML=html;
}

async function saveProfile(){
    if(viewUserId) return;
    const newNick = document.getElementById("inputNick").value.trim();
    const newAvatar = document.getElementById("inputAvatar").value.trim();
    // 这里目前写死冷却，后面再做真实冷却时间逻辑
    alert("冷却限制，暂时不能保存");
}

window.addEventListener('DOMContentLoaded',loadProfilePage);
</script>
</body>
</html>
