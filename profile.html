<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页</title>
    <style>
*{
    box-sizing: border-box;
}
body{
    margin:0;
    padding:16px;
    background:#f7f8fa;
    font-family:system-ui, sans-serif;
    color:#222;
}
.generic-page{
    max-width:900px;
    margin:0 auto;
    background:#fff;
    padding:24px;
    border-radius:12px;
    box-shadow:0 1px 4px #00000018;
}
.novel-card{
    border:1px solid #e5e7eb;
    border-radius:8px;
    padding:14px;
    margin:10px 0;
}
.novel-meta{
    color:#666;
    font-size:14px;
    margin:6px 0;
}
.novel-intro{
    color:#444;
    margin-top:8px;
}
.post-card{
    border:1px solid #e5e7eb;
    border-radius:8px;
    padding:14px;
    margin:10px 0;
}
.item-row{
    border:1px solid #e5e7eb;
    border-radius:8px;
    padding:14px;
    margin:10px 0;
}
.sugg-date{
    font-size:13px;
    color:#888;
}
.empty{
    color:#999;
}
a{
    color:#2563eb;
    text-decoration:none;
}
    </style>
</head>
<body>
    <main class="module-content">
        <div id="profileWrap"></div>
        <div style="margin-top:20px;">
            <a href="index.html">← 返回首页</a>
        </div>
    </main>

<script>
const SUPABASE_URL = 'https://gbktpjnitqpwomcprrol.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdia3Rwam5pdHFwd29tY3Bycm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MTk2NDIsImV4cCI6MjA5ODk5NTY0Mn0.TIp9NAdDRZrI16Jq_no7Ga9EpX7ooc6b5Ck7r-sNqww';

let loginUser = null;
let targetUserId = null;

function refreshUserStatus(){
    const raw = localStorage.getItem("userInfo");
    loginUser = raw ? JSON.parse(raw) : null;
}

async function supabaseRequest(table, method = 'GET', data = null, id = null) {
    const url = id
        ? `${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`
        : `${SUPABASE_URL}/rest/v1/${table}`;
    const options = {
        method: method,
        headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json; charset=utf-8',
            'Prefer': 'return=representation'
        }
    };
    if (data && (method === 'POST' || method === 'PATCH')) {
        options.body = JSON.stringify(data);
    }
    try {
        const res = await fetch(url, options);
        if (method === 'DELETE') return { ok: true };
        const result = await res.json();
        return result;
    } catch (e) {
        console.error('请求失败', e);
        return [];
    }
}

function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    const s = String(str);
    return s.replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
}

function formatTime(timeStr){
    if(!timeStr) return '';
    const d = new Date(timeStr);
    if(isNaN(d.getTime())) return '';
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    const h = String(d.getHours()).padStart(2,'0');
    const mi = String(d.getMinutes()).padStart(2,'0');
    return `${y}-${m}-${day} ${h}:${mi}`;
}

function getUrlParam(name){
    const params = new URLSearchParams(location.search);
    return params.get(name);
}

async function loadProfile(){
    refreshUserStatus();
    targetUserId = getUrlParam("uid");
    if(!targetUserId && loginUser){
        targetUserId = loginUser.id;
    }
    if(!targetUserId){
        alert("参数错误");
        return;
    }

    const allNovels = await supabaseRequest("novels");
    const userNovels = Array.isArray(allNovels) ? allNovels.filter(n=>n.user_id === targetUserId) : [];

    const allPosts = await supabaseRequest("posts");
    const userPosts = Array.isArray(allPosts) ? allPosts.filter(p=>p.user_id === targetUserId) : [];

    const allDiscuss = await supabaseRequest("discussions");
    const userDiscuss = Array.isArray(allDiscuss) ? allDiscuss.filter(d=>d.user_id === targetUserId) : [];

    const box = document.getElementById("profileWrap");
    box.innerHTML = `
    <div class="generic-page">
        <h1>👤 用户主页</h1>
        <div style="margin-bottom:24px;">
            <p><strong>用户ID：</strong>${escapeHtml(targetUserId)}</p>
            <p>📖 小说：${userNovels.length} 篇</p>
            <p>📸 日常分享：${userPosts.length} 条</p>
            <p>💬 讨论：${userDiscuss.length} 条</p>
        </div>

        <h2>📖 发布的小说</h2>
        ${userNovels.length ===0 ? "<p class='empty'>暂无小说</p>" : userNovels.map(n=>`
        <div class="novel-card">
            <div class="novel-info">
                <h3>${escapeHtml(n.title||"无题")}</h3>
                <div class="novel-meta">👍 ${n.likes||0}</div>
                <div class="novel-intro">${escapeHtml(n.intro||"暂无简介")}</div>
            </div>
        </div>
        `).join('')}

        <hr style="margin:30px 0;">
        <h2>📸 日常分享</h2>
        ${userPosts.length ===0 ? "<p class='empty'>暂无分享</p>" : userPosts.map(p=>`
        <div class="post-card">
            <span class="sugg-date">🕐 ${formatTime(p.created_at)}</span>
            <div class="post-content">${escapeHtml(p.content||"")}</div>
        </div>
        `).join('')}

        <hr style="margin:30px 0;">
        <h2>💬 发表的讨论</h2>
        ${userDiscuss.length ===0 ? "<p class='empty'>暂无讨论</p>" : userDiscuss.map(d=>`
        <div class="item-row">
            <span class="sugg-date">🕐 ${formatTime(d.created_at)}</span>
            <div>${escapeHtml(d.content)}</div>
        </div>
        `).join('')}
    </div>
    `;
}

window.addEventListener('DOMContentLoaded', loadProfile);
</script>
</body>
</html>
