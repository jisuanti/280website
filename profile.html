<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; 
            background: #f4f1eb; 
            color: #2c2c2c; 
            line-height: 1.6;
        }
        /* 和index完全一致头部导航 */
        .site-header { 
            background: #3e2723; 
            color: #fff; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .header-inner { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 12px 16px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }
        .logo { 
            font-size: 1.3em; 
            font-weight: 700; 
            white-space: nowrap; 
            flex-shrink: 0;
        }
        .main-nav { 
            display: flex; 
            gap: 4px; 
            flex: 1; 
            overflow-x: auto; 
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .main-nav::-webkit-scrollbar { display: none; }
        .nav-item { 
            color: rgba(255,255,255,0.8); 
            text-decoration: none; 
            padding: 8px 14px; 
            border-radius: 20px; 
            font-size: 0.95em; 
            transition: 0.2s; 
            white-space: nowrap; 
            cursor: pointer; 
            user-select: none;
            flex-shrink: 0;
        }
        .nav-item:hover { background: rgba(255,255,255,0.15); color: #fff; }
        .user-bar{
            display:flex;
            align-items:center;
            gap:10px;
            flex-shrink:0;
            font-size:0.9em;
        }
        .user-bar a{
            color:rgba(255,255,255,0.8);
            text-decoration:none;
            padding:4px 8px;
            border-radius:6px;
        }
        .user-bar a:hover{
            background:rgba(255,255,255,0.15);
            color:#fff;
        }
        .nav-avatar{
            width:28px;
            height:28px;
            border-radius:50%;
            object-fit:cover;
            flex-shrink:0;
        }
        .user-bar-logged{
            display:flex;
            align-items:center;
            gap:8px;
        }
        .admin-link { 
            color: #ffcc80; 
            text-decoration: none; 
            font-size: 0.9em; 
            border: 1px solid #ffcc80; 
            padding: 6px 12px; 
            border-radius: 20px; 
            white-space: nowrap; 
            transition: 0.2s; 
            flex-shrink: 0;
        }
        .admin-link:hover { background: #ffcc80; color: #3e2723; }
        .module-content { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px 16px; 
        }
        .generic-page { 
            background: #fff; 
            border-radius: 12px; 
            padding: 24px; 
            box-shadow: 0 2px 12px rgba(0,0,0,0.08); 
        }
        .novel-card,.post-card,.item-row{ 
            border:1px solid #e5e7eb; 
            border-radius:8px; 
            padding:14px; 
            margin:10px 0;
        }
        .novel-meta{color:#666;font-size:14px;margin:6px 0;}
        .novel-intro{color:#444;margin-top:8px;}
        .sugg-date{font-size:13px;color:#888;}
        .empty{color:#999;padding:20px 0;}
        a{color:#2563eb;text-decoration:none;}
        hr{margin:24px 0;border:0;border-top:1px solid #eee;}
        h1,h2{margin-bottom:12px;color:#3e2723;}
        @media (max-width:768px){
            .header-inner{padding:10px 12px;}
            .generic-page{padding:16px;}
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <h1 class="logo">🏫 280班</h1>
            <nav class="main-nav" id="mainNav">
                <div class="nav-item" onclick="location.href='index.html#book'">📖历史书</div>
                <div class="nav-item" onclick="location.href='index.html#notice'">📋公告栏</div>
                <div class="nav-item" onclick="location.href='index.html#novel'">📖小说</div>
                <div class="nav-item" onclick="location.href='index.html#submit'">✍️创作投稿</div>
                <div class="nav-item" onclick="location.href='index.html#discuss'">💬讨论</div>
                <div class="nav-item" onclick="location.href='index.html#share'">📸日常分享</div>
            </nav>
            <div class="user-bar" id="userBar"></div>
            <a href="admin.html" class="admin-link">管理</a>
        </div>
    </header>
    <main class="module-content" id="moduleContent">
        <div id="profileWrap"></div>
    </main>
<script>
const SUPABASE_URL = 'https://gbktpjnitqpwomcprrol.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdia3Rwam5pdHFwd29tY3Bycm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MTk2NDIsImV4cCI6MjA5ODk5NTY0Mn0.TIp9NAdDRZrI16Jq_no7Ga9EpX7ooc6b5Ck7r-sNqww';
let loginUser = null;
let targetUserId = null;
let targetUserInfo = null;

function refreshUserStatus(){
    const raw = localStorage.getItem("userInfo");
    loginUser = raw ? JSON.parse(raw) : null;
    renderUserBar();
}

function renderUserBar(){
    const bar = document.getElementById("userBar");
    if(!loginUser){
        bar.innerHTML = `
            <a href="login.html">登录</a>
            <a href="register.html">注册</a>
        `;
    }else{
        const avatarSrc = loginUser.avatar ? escapeHtml(loginUser.avatar) : "";
        bar.innerHTML = `
            <div class="user-bar-logged">
    <a href="profile.html" style="display:flex;align-items:center;gap:6px;color:unset;text-decoration:none;">
        ${avatarSrc ? `<img class="nav-avatar" src="${avatarSrc}" alt="头像">` : "👤"}
        <span>${escapeHtml(loginUser.nickname)}</span>
    </a>
</div>
                    <a href="profile.html">个人主页</a>
                    <a href="javascript:logout()">退出</a>
        `;
    }
}

function logout(){
    localStorage.removeItem("userInfo");
    refreshUserStatus();
}

async function supabaseRequest(table, method = 'GET', data = null, query = null) {
    let url = `${SUPABASE_URL}/rest/v1/${table}`;
    if(query){
        url += "?" + query;
    }
    const options = {
        method: method,
        headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json; charset=utf-8',
            'Prefer': 'return=representation'
        }
    };
    if (data && (method === 'POST' || method === 'PATCH')) {
        options.body = JSON.stringify(data);
    }
    try {
        const res = await fetch(url, options);
        if (method === 'DELETE') return { ok: true };
        const result = await res.json();
        return result;
    } catch (e) {
        console.error('请求失败', e);
        return [];
    }
}

function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    const s = String(str);
    return s.replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
}

function formatTime(timeStr){
    if(!timeStr) return '';
    const d = new Date(timeStr);
    if(isNaN(d.getTime())) return '';
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    const h = String(d.getHours()).padStart(2,'0');
    const mi = String(d.getMinutes()).padStart(2,'0');
    return `${y}-${m}-${day} ${h}:${mi}`;
}

function getUrlParam(name){
    const params = new URLSearchParams(location.search);
    return params.get(name);
}

function renderPostsPartial(userPosts, targetUid){
    const postWrapDom = document.getElementById("userPostsWrap");
    if(!postWrapDom) return;
    postWrapDom.innerHTML = !Array.isArray(userPosts) || userPosts.length ===0 
        ? "<p class='empty'>暂无分享</p>" 
        : userPosts.map(p=>`
 <div class="post-card">
 <span class="sugg-date">🕐 ${formatTime(p.created_at)}</span>
 <div class="post-content">${escapeHtml(p.content||"")}</div>
 </div>
 `).join('');
}

async function loadProfile(){
    refreshUserStatus();
    const wrapDom = document.getElementById("profileWrap");
    if(!wrapDom) return;
    let rawUid = getUrlParam("uid");
    if(rawUid !== null){
      targetUserId = Number(rawUid);
    }else if(loginUser){
      targetUserId = loginUser.id;
    }
    if(!targetUserId){
        wrapDom.innerHTML = `<div class="generic-page"><p>请登录后访问个人主页</p><a href="index.html">返回首页</a></div>`;
        return;
    }
    
    const [userList, allNovels, allDiscuss] = await Promise.all([
      supabaseRequest("users"),
      supabaseRequest("novels"),
      supabaseRequest("discussions")
    ]);

    if(Array.isArray(userList)){
      targetUserInfo = userList.find(u=>u.id === targetUserId);
    }
    const userNovels = Array.isArray(allNovels) ? allNovels.filter(n=>n.user_id === targetUserId) : [];
    const userDiscuss = Array.isArray(allDiscuss) ? allDiscuss.filter(d=>d.user_id === targetUserId) : [];

    const userName = targetUserInfo?.nickname || "未知用户";
    const pageAvatar = (targetUserInfo && targetUserInfo.avatar) 
        ? `<img class="nav-avatar" style="width:40px;height:40px;" src="${escapeHtml(targetUserInfo.avatar)}">` 
        : "👤";

    wrapDom.innerHTML = `
 <div class="generic-page">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">
        ${pageAvatar}
        <h1>${escapeHtml(userName)} 的主页</h1>
    </div>
    <div style="margin-bottom:24px;">
        <p><strong>用户ID：</strong>${escapeHtml(targetUserId)}</p>
        <p>📖 小说：${userNovels.length} 篇</p>
        <p>📸 日常分享：<span id="postsCountText">加载中…</span> 条</p>
        <p>💬 讨论：${userDiscuss.length} 条</p>
    </div>
    ${(loginUser && targetUserId === loginUser.id) ? `
<div style="border:1px solid #ddd;padding:16px;margin:12px 0;border-radius:8px;">
<h3>编辑个人资料</h3>
<div>
  <label>头像URL：</label>
  <input type="text" id="editAvatarInput" value="${escapeHtml(targetUserInfo.avatar||'')}" style="width:100%;padding:4px;margin:4px 0;">
</div>
<div>
  <label>昵称：</label>
  <input type="text" id="editNickInput" value="${escapeHtml(targetUserInfo.nickname||'')}" style="width:100%;padding:4px;margin:4px 0;">
</div>
<button id="saveProfileBtn" style="margin-top:8px;padding:6px 12px;">保存修改</button>
</div>
` : ''}
<h2>📖 发布的小说</h2>
    ${userNovels.length ===0 ? "<p class='empty'>暂无小说</p>" : userNovels.map(n=>`
 <div class="novel-card">
 <div class="novel-info">
 <h3>${escapeHtml(n.title||"无题")}</h3>
 <div class="novel-meta">👍 ${n.likes||0}</div>
 <div class="novel-intro">${escapeHtml(n.intro||"暂无简介")}</div>
 </div>
 </div>
 `).join('')}
 <hr>
 <h2>📸 日常分享</h2>
 <div id="userPostsWrap">
    <p class='empty'>帖子加载中，请稍候…</p>
 </div>
 <hr>
 <h2>💬 发表的讨论</h2>
 ${userDiscuss.length ===0 ? "<p class='empty'>暂无讨论</p>" : userDiscuss.map(d=>`
 <div class="item-row">
 <span class="sugg-date">🕐 ${formatTime(d.created_at)}</span>
 <div>${escapeHtml(d.content)}</div>
 </div>
 `).join('')}
 </div>
 `;

    (async ()=>{
      try{
        const userPosts = await supabaseRequest("posts","GET",null,`user_id=eq.${targetUserId}`);
        renderPostsPartial(userPosts, targetUserId);
        const countDom = document.getElementById("postsCountText");
        if(countDom) countDom.innerText = Array.isArray(userPosts) ? userPosts.length : 0;
      }catch(err){
        console.error("posts加载失败",err);
        const wrap = document.getElementById("userPostsWrap");
        if(wrap) wrap.innerHTML = `<p class='empty'>帖子加载失败</p>`;
      }
    })();
}
window.addEventListener('DOMContentLoaded', loadProfile);
</script>
</body>
</html>
