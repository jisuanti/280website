<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册账号</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    background:#f4f1eb;
    font-family:"Microsoft YaHei",sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:16px;
}
.box{
    background:#fff;
    padding:28px 24px;
    border-radius:12px;
    box-shadow:0 2px 14px rgba(0,0,0,0.08);
    width:100%;
    max-width:420px;
}
h1{
    text-align:center;
    margin-bottom:22px;
    color:#3e2723;
    font-size:1.5em;
}
label{
    display:block;
    margin:14px 0 6px;
    font-weight:600;
    font-size:0.95em;
}
input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:1em;
}
.btns{
    margin-top:24px;
}
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#8d6e63;
    color:#fff;
    font-size:1em;
    cursor:pointer;
}
button:disabled{background:#aaa;cursor:not-allowed;}
.tip{margin-top:14px;text-align:center;font-size:0.9em;}
.tip a{color:#2563eb;text-decoration:none;}
</style>
</head>
<body>
<div class="box">
    <h1>账号注册</h1>
    <label>昵称</label>
    <input id="regNick" placeholder="你的昵称">
    <label>密码</label>
    <input type="password" id="regPwd" placeholder="设置密码">
    <label>确认密码</label>
    <input type="password" id="regPwd2" placeholder="再次输入密码">
    <div class="btns">
        <button id="regBtn" onclick="doRegister()">注册账号</button>
    </div>
    <div class="tip">已有账号？<a href="login.html">去登录</a></div>
</div>
<script>
const SUPABASE_URL = "https://gbktpjnitqpwomcprrol.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdia3Rwam5pdHFwd29tY3Bycm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MTk2NDIsImV4cCI6MjA5ODk5NTY0Mn0.TIp9NAdDRZrI16Jq_no7Ga9EpX7ooc6b5Ck7r-sNqww";

//【选项1：本机设备注册限制】
if(localStorage.getItem("hasRegistered") === "1"){
    alert("⚠️本机已经注册过账号，一台设备只允许注册一个账号！");
    document.querySelector("#regBtn").disabled = true;
}

async function supabaseReq(table,method="GET",data=null,id=null){
    const url = id ? `${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}` : `${SUPABASE_URL}/rest/v1/${table}`;
    const opt={
        method,
        headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":`Bearer ${SUPABASE_KEY}`,
            "Content-Type":"application/json;charset=utf-8",
            "Prefer":"return=representation"
        }
    };
    if((method==="POST"||method==="PATCH")&&data) opt.body=JSON.stringify(data);
    const res=await fetch(url,opt);
    if(method==="DELETE") return {ok:true};
    return await res.json();
}

async function doRegister(){
    const nick = document.getElementById("regNick").value.trim();
    const pwd1 = document.getElementById("regPwd").value;
    const pwd2 = document.getElementById("regPwd2").value;
    if(!nick) return alert("请填写昵称");
    if(!pwd1) return alert("请填写密码");
    if(pwd1!==pwd2) return alert("两次密码不一致");
    const all = await supabaseReq("users");
    const exist = Array.isArray(all) && all.find(u=>u.nickname===nick);
    if(exist) return alert("该昵称已经被占用");
    const res = await supabaseReq("users","POST",{
        nickname:nick,
        password:pwd1,
        avatar:""
    });
    if(res&&res.id){
        //标记本机已经注册
        localStorage.setItem("hasRegistered","1");
        alert("注册成功！跳转登录页");
        location.href="login.html";
    }else{
        alert("注册失败");
    }
}
</script>
</body>
</html>
