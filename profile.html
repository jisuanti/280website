<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; 
            background: #f4f1eb; 
            color: #2c2c2c; 
            line-height: 1.6;
        }
        .container {
            max-width:1100px;
            margin:0 auto;
            padding:20px 16px;
        }
        .page-card{
            background:#fff;
            border-radius:12px;
            padding:24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            margin-bottom:20px;
        }
        .profile-head{
            display:flex;
            gap:20px;
            align-items:center;
            flex-wrap:wrap;
        }
        .avatar-box img{
            width:120px;
            height:120px;
            border-radius:50%;
            object-fit:cover;
            border:3px solid #d7ccc8;
        }
        .info h2{
            font-size:1.6em;
            color:#3e2723;
            margin-bottom:6px;
        }
        .cooltip{
            color:#c62828;
            font-size:0.9em;
            margin:8px 0;
        }
        .oktip{
            color:#2e7d32;
            font-size:0.9em;
            margin:8px 0;
        }
        .edit-area{
            margin-top:16px;
        }
        label{
            display:block;
            margin:12px 0 6px;
            font-weight:600;
            font-size:0.95em;
        }
        input{
            width:100%;
            padding:11px;
            border:1px solid #ddd;
            border-radius:8px;
            font-size:1em;
        }
        .btn-group{
            margin-top:18px;
            display:flex;
            gap:12px;
        }
        button{
            padding:10px 20px;
            border-radius:8px;
            border:none;
            cursor:pointer;
            font-size:0.95em;
        }
        .save-btn{
            background:#8d6e63;
            color:white;
        }
        .back-btn{
            background:#eeeeee;
        }
        .tab-bar{
            display:flex;
            gap:8px;
            margin:20px 0;
            border-bottom:1px solid #ddd;
            padding-bottom:8px;
        }
        .tab{
            padding:8px 16px;
            cursor:pointer;
            border-radius:8px 8px 0 0;
        }
        .tab.active{
            background:#e8d5c4;
            color:#3e2723;
            font-weight:600;
        }
        .list-item{
            padding:14px;
            background:#f9f9f9;
            border-radius:8px;
            margin-bottom:10px;
        }
        .hidden{
            display:none;
        }
        @media (max-width:768px){
            .profile-head{
                flex-direction:column;
                text-align:center;
            }
            .avatar-box{
                margin:0 auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-card">
            <div class="profile-head">
                <div class="avatar-box">
                    <img id="avatarImg" src="" alt="头像">
                </div>
                <div class="info">
                    <h2 id="nicknameText">加载中...</h2>
                    <p>账号：<span id="usernameText"></span></p>
                    <div id="coolMessage"></div>
                    <div class="edit-area">
                        <label>新昵称</label>
                        <input id="inputNick" placeholder="输入昵称">
                        <label>头像链接</label>
                        <input id="inputAvatar" placeholder="粘贴图片在线地址">
                        <div class="btn-group">
                            <button class="save-btn" id="saveBtn">保存修改</button>
                            <button class="back-btn" onclick="location.href='index.html'">返回首页</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-card">
            <div class="tab-bar">
                <div class="tab active" data-target="tabNovel">我的小说</div>
                <div class="tab" data-target="tabPost">日常分享</div>
                <div class="tab" data-target="tabSubmit">投稿记录</div>
            </div>
            <div id="tabNovel" class="tab-content"></div>
            <div id="tabPost" class="tab-content hidden"></div>
            <div id="tabSubmit" class="tab-content hidden"></div>
        </div>
    </div>

<script>
    const SUPABASE_URL = 'https://gbktpjnitqpwomcprrol.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdia3Rwam5pdHFwd29tY3Bycm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MTk2NDIsImV4cCI6MjA5ODk5NTY0Mn0.TIp9NAdDRZrI16Jq_no7Ga9EpX7ooc6b5Ck7r-sNqww';
    let loginUser = null;
    const COOL_SECOND = 60 * 24 * 60 * 60; // 60天冷却

    async function supabaseRequest(table, method = 'GET', data = null, id = null) {
        const url = id
            ? `${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`
            : `${SUPABASE_URL}/rest/v1/${table}`;
        const options = {
            method,
            headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json; charset=utf-8',
                'Prefer': 'return=representation'
            }
        };
        if (data && (method === 'POST' || method === 'PATCH')) {
            options.body = JSON.stringify(data);
        }
        try {
            const res = await fetch(url, options);
            if (method === 'DELETE') return { ok: true };
            return await res.json();
        } catch (e) {
            console.error(e);
            return [];
        }
    }

    function escapeHtml(str){
        if(!str) return "";
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // 检测登录状态
    function checkLogin(){
        const raw = localStorage.getItem("userInfo");
        if(!raw){
            alert("请先登录！");
            location.href="login.html";
            return false;
        }
        loginUser = JSON.parse(raw);
        return true;
    }

    // 加载用户基础信息
    async function loadUserInfo(){
        const userData = await supabaseRequest("users");
        const user = userData.find(u=>u.id === loginUser.id);
        if(!user){
            alert("用户信息异常");
            return;
        }
        document.getElementById("nicknameText").innerText = escapeHtml(user.nickname);
        document.getElementById("usernameText").innerText = escapeHtml(user.username);
        document.getElementById("inputNick").value = user.nickname;
        document.getElementById("inputAvatar").value = user.avatar || "";
        document.getElementById("avatarImg").src = user.avatar || "https://via.placeholder.com/120";

        // 冷却判断
        const msgBox = document.getElementById("coolMessage");
        const saveBtn = document.getElementById("saveBtn");
        if(!user.last_modify_info){
            msgBox.innerHTML = `<span class="oktip">✅ 无冷却，可以修改昵称和头像</span>`;
            saveBtn.disabled = false;
        }else{
            const last = new Date(user.last_modify_info).getTime();
            const now = Date.now();
            const diff = now - last;
            if(diff >= COOL_SECOND * 1000){
                msgBox.innerHTML = `<span class="oktip">✅ 冷却结束，可以修改昵称和头像</span>`;
                saveBtn.disabled = false;
            }else{
                const remainSec = Math.ceil((COOL_SECOND * 1000 - diff)/1000);
                const day = Math.floor(remainSec / (24*3600));
                const hour = Math.floor((remainSec % (24*3600)) / 3600);
                msgBox.innerHTML = `<span class="cooltip">❌ 冷却中，剩余 ${day}天${hour}小时，暂时无法修改资料</span>`;
                saveBtn.disabled = true;
            }
        }
    }

    // 保存修改
    async function saveProfile(){
        const newNick = document.getElementById("inputNick").value.trim();
        const newAvatar = document.getElementById("inputAvatar").value.trim();
        if(!newNick){
            alert("昵称不能为空");
            return;
        }
        await supabaseRequest("users", "PATCH", {
            nickname: newNick,
            avatar: newAvatar,
            last_modify_info: new Date().toISOString()
        }, loginUser.id);
        // 更新本地缓存登录信息
        loginUser.nickname = newNick;
        loginUser.avatar = newAvatar;
        localStorage.setItem("userInfo", JSON.stringify(loginUser));
        alert("修改成功！冷却时间已重置");
        location.reload();
    }

    // 加载三类作品
    async function loadMyWorks(){
        const novels = await supabaseRequest("novels");
        const posts = await supabaseRequest("posts");
        const submits = await supabaseRequest("submissions");

        const myNovels = novels.filter(x=>x.user_id === loginUser.id);
        const myPosts = posts.filter(x=>x.user_id === loginUser.id);
        const mySubmits = submits.filter(x=>x.user_id === loginUser.id);

        renderList("tabNovel", myNovels.map(n=>`
            <div class="list-item">
                <strong>${escapeHtml(n.title)}</strong>
                <p>点赞：${n.likes||0}</p>
            </div>
        `));
        renderList("tabPost", myPosts.map(p=>`
            <div class="list-item">
                <p>${escapeHtml(p.content || "无文字内容")}</p>
                <p>点赞：${p.likes||0}</p>
            </div>
        `));
        renderList("tabSubmit", mySubmits.map(s=>`
            <div class="list-item">
                <strong>投稿状态：${escapeHtml(s.status||"待审核")}</strong>
            </div>
        `));
    }

    function renderList(containerId, htmlArr){
        const box = document.getElementById(containerId);
        box.innerHTML = htmlArr.length ? htmlArr.join("") : "<p>暂无内容</p>";
    }

    // 标签切换
    document.querySelectorAll(".tab").forEach(tab=>{
        tab.onclick = function(){
            const target = this.dataset.target;
            document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
            document.querySelectorAll(".tab-content").forEach(c=>c.classList.add("hidden"));
            this.classList.add("active");
            document.getElementById(target).classList.remove("hidden");
        }
    })

    document.getElementById("saveBtn").onclick = saveProfile;

    async function init(){
        if(!checkLogin()) return;
        await loadUserInfo();
        await loadMyWorks();
    }
    init();
</script>
</body>
</html>
