<script>
        // ===== 账号登录全局变量【完整保留】 =====
        let loginUser = null;
        let onlineTimer = null; // 定时器，防止内存泄漏
        function refreshUserStatus(){
            const raw = localStorage.getItem("userInfo");
            loginUser = raw ? JSON.parse(raw) : null;
            renderUserBar();
        }
        function renderUserBar(){

        ${avatarSrc ? `<img class="nav-avatar" src="${avatarSrc}" alt="头像">` : "👤"}
        <span>${escapeHtml(loginUser.nickname)}</span>
    </a>
</div>
                    <a href="profile.html">个人主页</a>
                    <a href="javascript:logout()">退出</a>
                `;

        }

            return true;
        }
        // ===== Supabase 配置 =====
        const SUPABASE_URL = 'https://gbktpjnitqpwomcprrol.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdia3Rwam5pdHFwd29tY3Bycm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MTk2NDIsImV4cCI6MjA5ODk5NTY0Mn0.TIp9NAdDRZrI16Jq_no7Ga9EpX7ooc6b5Ck7r-sNqww';
        async function supabaseRequest(table, method = 'GET', data = null, id = null) {
            const url = id
                ? `${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`
                : `${SUPABASE_URL}/rest/v1/${table}`;
            const options = {
                method: method,
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json; charset=utf-8',
                    'Prefer': 'return=representation'
                }
            };
            if (data && (method === 'POST' || method === 'PATCH')) {
                options.body = JSON.stringify(data);
            }
            try {
                const res = await fetch(url, options);
                if (method === 'DELETE') return { ok: true };
                const result = await res.json();
                return result;
            } catch (e) {
                console.error('Supabase 请求失败：', e);
                return [];
            }
        }

        function formatText(text) {
            if (!text) return '';
            return text.split('\n').filter(l => l.trim()).map(l => `<p>${escapeHtml(l)}</p>`).join('');
        }
        function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    const s = String(str);
    return s.replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
}
function formatTime(timeStr){
    if(!timeStr) return '';
    const d = new Date(timeStr);
    if(isNaN(d.getTime())) return '';
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    const h = String(d.getHours()).padStart(2,'0');
    const mi = String(d.getMinutes()).padStart(2,'0');
    return `${y}-${m}-${day} ${h}:${mi}`;
}

        function getGuestId(){
            let gid = localStorage.getItem("guest_id");
            if(!gid){
                gid = "guest_" + Date.now() + "_" + Math.random().toString(36).slice(2);
                localStorage.setItem("guest_id", gid);
            }

async function registerOnline() {
    // 先清除旧定时器
    if(onlineTimer) clearInterval(onlineTimer);
    try {
        const expireMs = 90 * 1000;
        const now = Date.now();
        const allOnlineRaw = await supabaseRequest('online_users');
        const onlineList = Array.isArray(allOnlineRaw) ? allOnlineRaw : [];
        // 清理超时用户
        for (const item of onlineList) {
            const activeTime = new Date(item.last_active).getTime();
            if (now - activeTime > expireMs) {
                await supabaseRequest('online_users', 'DELETE', null, item.id).catch(() => { });
            }
        }
        const freshList = Array.isArray(await supabaseRequest('online_users')) ? await supabaseRequest('online_users') : [];
        let currentNick, uniqueId;
        if(loginUser){
            currentNick = loginUser.nickname;
            uniqueId = "user_" + loginUser.id;
        }else{
            currentNick = "游客";
            uniqueId = getGuestId();
        }
        const me = freshList.find(u => u.unique_id === uniqueId);
        if (me) {
            await supabaseRequest('online_users', 'PATCH', {
                last_active: new Date().toISOString(),
                nickname: currentNick
            }, me.id).catch(() => { });
        } else {    
             await supabaseRequest('online_users', 'POST', {
                unique_id: uniqueId,
                nickname: currentNick,
                last_active: new Date().toISOString()
            }).catch(() => { });
        }

        onlineTimer = setInterval(async () => {
            try {
                const tickNow = Date.now();
                // 只请求1次，不要重复多次请求接口！！
                let tickListRaw = await supabaseRequest('online_users');
                let tickList = Array.isArray(tickListRaw) ? tickListRaw : [];

                for (const item of tickList) {
                    const t = new Date(item.last_active).getTime();
                    if (tickNow - t > expireMs) {
                        await supabaseRequest('online_users', 'DELETE', null, item.id).catch(() => { });
                    }
                }
                // 删除重复请求，直接复用上面数据，不再重新拉一遍
                let selfNick, selfUid;
                if(loginUser){
                    selfNick = loginUser.nickname;
                    selfUid = "user_" + loginUser.id;
                }else{
                    selfNick = "游客";
                    selfUid = getGuestId();
                }
                const self = tickList.find(u => u.unique_id === selfUid);
                if (self) {
                    await supabaseRequest('online_users', 'PATCH', {
                        last_active: new Date().toISOString(),
                        nickname: selfNick
                    }, self.id).catch(() => { });
                }
                document.getElementById('onlineCount').textContent = tickList.length;
            }catch(tickErr){
                console.warn("心跳循环出错",tickErr);
            }
        }, 30000);
        document.getElementById('onlineCount').textContent = freshList.length;
    } catch (e) {
        console.error('在线用户异常', e);
