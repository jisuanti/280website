<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账号登录</title>
<style>
:root{
    --glass-bg: rgba(255,255,255,0.6);
    --glass-border: rgba(255,255,255,0.7);
    --glass-shadow: 0 8px 40px rgba(31,38,135,0.10);
    --glass-blur: saturate(180%) blur(20px);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
    background:
        radial-gradient(circle at 10% 10%, #f6e7d6 0%, transparent 45%),
        radial-gradient(circle at 90% 20%, #e0ecf5 0%, transparent 45%),
        radial-gradient(circle at 50% 100%, #ede0d1 0%, transparent 55%),
        linear-gradient(135deg, #f0e9df 0%, #e8dfd3 100%);
    background-attachment:fixed;
}
.box{
    width:100%;max-width:420px;padding:32px;
    background:var(--glass-bg);
    backdrop-filter:var(--glass-blur);
    -webkit-backdrop-filter:var(--glass-blur);
    border:1px solid var(--glass-border);
    border-radius:24px;
    box-shadow:var(--glass-shadow);
}
h2{text-align:center;margin-bottom:24px;color:#3e2723;}
input{
    width:100%;padding:13px 16px;margin:8px 0;
    border:1px solid rgba(255,255,255,0.85);
    border-radius:14px;font-size:16px;
    background:rgba(255,255,255,0.75);outline:none;transition:.2s;
}
input:focus{border-color:rgba(141,110,99,0.55);background:rgba(255,255,255,0.95);box-shadow:0 0 0 4px rgba(141,110,99,0.10);}
button{
    width:100%;padding:14px;margin-top:12px;
    background:#8d6e63;color:#fff;border:none;border-radius:14px;
    font-size:16px;cursor:pointer;font-weight:600;transition:.2s;
    box-shadow:0 6px 18px rgba(141,110,99,0.35);
}
button:hover{background:#6d4c41;}
.tip{margin-top:16px;text-align:center;font-size:14px;color:#555;}
.tip a{color:#8d6e63;text-decoration:none;font-weight:600;}
.tip a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="box">
    <h2>账号登录</h2>
    <input id="loginUser" placeholder="登录账号">
    <input id="loginPwd" type="password" placeholder="登录密码">
    <button id="loginBtn">登录</button>
    <div class="tip">没有账号？<a href="register.html">立即注册</a></div>
</div>

<script>
const SUPABASE_URL = 'https://gbktpjnitqpwomcprrol.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdia3Rwam5pdHFwd29tY3Bycm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MTk2NDIsImV4cCI6MjA5ODk5NTY0Mn0.TIp9NAdDRZrI16Jq_no7Ga9EpX7ooc6b5Ck7r-sNqww';

async function api(table){
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
        headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`
        }
    });
    return await res.json();
}

document.getElementById('loginBtn').onclick = async () => {
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPwd').value.trim();
    if (!username || !password) return alert('账号密码不能为空');

    const list = await api('users');
    const user = Array.isArray(list) && list.find(u => u.username === username && u.password === password);
    if (!user) return alert('账号或密码错误');

    // 登录成功存储用户信息
    localStorage.setItem('userInfo', JSON.stringify({
        id: user.id,
        username: user.username,
        nickname: user.nickname,
        avatar: user.avatar
    }));
    alert('登录成功！');
    location.href = 'index.html';
};
</script>
</body>
</html>
