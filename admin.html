<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台管理 - 280班网站</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family: "Microsoft YaHei",sans-serif;
    background:#f4f1eb;
    color:#333;
    line-height:1.6;
}
header{
    background:#3e2723;
    color:#fff;
    padding:14px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
}
header h1{font-size:1.4em;}
header a{
    color:#ffcc80;
    text-decoration:none;
    border:1px solid #ffcc80;
    padding:6px 14px;
    border-radius:20px;
}
header a:hover{background:#ffcc80;color:#3e2723;}
.container{
    max-width:1240px;
    margin:24px auto;
    padding:0 16px;
}
.tab-bar{
    display:flex;
    gap:8px;
    margin-bottom:20px;
    flex-wrap:wrap;
}
.tab{
    padding:10px 16px;
    background:#fff;
    border-radius:8px;
    cursor:pointer;
    border:1px solid #ddd;
    user-select:none;
}
.tab.active{
    background:#8d6e63;
    color:#fff;
    border-color:#8d6e63;
}
.panel{
    background:#fff;
    border-radius:12px;
    padding:24px;
    box-shadow:0 2px 12px rgba(0,0,0,0.08);
    display:none;
}
.panel.show{display:block;}
h2{
    margin-bottom:18px;
    color:#3e2723;
    padding-bottom:10px;
    border-bottom:2px solid #d7ccc8;
}
label{
    display:block;
    margin:14px 0 6px;
    font-weight:600;
}
input,textarea,select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:1em;
    font-family:inherit;
}
textarea{min-height:100px;resize:vertical;}
textarea.big{min-height:220px;}
.btns{
    margin-top:20px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}
button{
    padding:10px 22px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:1em;
}
.btn-primary{background:#8d6e63;color:#fff;}
.btn-success{background:#43a047;color:#fff;}
.btn-danger{background:#c62828;color:#fff;}
.btn-default{background:#bbbbbb;color:#fff;}
.btn-primary:hover{background:#6d4c41;}
.list-item{
    background:#f9f9f9;
    padding:16px;
    border-radius:8px;
    margin-bottom:12px;
}
.list-item h4{margin-bottom:6px;color:#3e2723;}
.list-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;}
.info-text{color:#666;margin:10px 0;}
pre{
    background:#efefef;
    padding:10px;
    border-radius:6px;
    white-space:pre-wrap;
    max-height:300px;
    overflow:auto;
    margin:8px 0;
}
/* 登录弹窗样式 */
.login-wrap{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:999;
}
.login-box{
    background:#fff;
    padding:32px;
    border-radius:12px;
    width:min(90%,420px);
}
@media(max-width:768px){
    .tab-bar{gap:6px;}
    .tab{padding:8px 12px;font-size:0.9em;}
}
</style>
</head>
<body>
<!-- 主管理员登录界面 -->
<div class="login-wrap" id="loginBox">
    <div class="login-box">
        <h2>管理员登录</h2>
        <label>请输入管理密码</label>
        <input type="password" id="adminPwd" placeholder="输入密码">
        <div class="btns">
            <button class="btn-primary" onclick="loginCheck()">登录后台</button>
        </div>
        <p class="info-text" id="loginTip" style="color:red;display:none;">密码错误，请重试</p>
    </div>
</div>
<!--激活数字模块独立密码弹窗 -->
<div class="login-wrap" id="activatePwdBox" style="display:none;">
    <div class="login-box">
        <h2>🔢激活数字管理 需要额外密码</h2>
        <label>输入额外访问密码</label>
        <input type="password" id="extraPwdInput" placeholder="">
        <div class="btns">
            <button class="btn-primary" onclick="checkExtraPassword()">确认</button>
            <button class="btn-default" onclick="closeActivatePwdBox()">取消</button>
        </div>
        <p id="extraPwdTip" style="color:red;display:none;">密码错误</p>
    </div>
</div>
<div id="adminMain" style="display:none;">
<header>
    <h1>⚙️ 280班网站后台管理中心</h1>
    <a href="index.html">← 返回前台主页</a>
</header>
<div class="container">
    <div class="tab-bar">
        <div class="tab active" data-target="tab-chapter">📖历史书章节管理</div>
        <div class="tab" data-target="tab-notice">📋公告管理</div>
        <div class="tab" data-target="tab-submit">📨投稿审核</div>
        <div class="tab" data-target="tab-online">🟢在线用户</div>
        <div class="tab" data-target="tab-novel">📖小说管理</div>
        <div class="tab" data-target="tab-discuss">💬讨论管理</div>
        <div class="tab" data-target="tab-share">📸日常分享管理</div>
        <div class="tab" data-target="tab-activate">🔢激活数字管理</div>
    </div>
    <!-- ========== 1.历史书章节管理 ========== -->
    <div class="panel show" id="tab-chapter">
        <h2>新增 / 编辑章节</h2>
        <input type="hidden" id="editChapterId" value="">
        <label>章节标题</label>
        <input id="chTitle" placeholder="第X章 XXXXX">
        <label>课前导言</label>
        <textarea id="chPreface"></textarea>
        <label>正文内容</label>
        <textarea id="chBody" class="big"></textarea>
        <label>课后习题</label>
        <textarea id="chExercises"></textarea>
        <label>知识扩展</label>
        <textarea id="chExtension"></textarea>
        <div class="btns">
            <button class="btn-primary" onclick="saveChapter()">保存章节</button>
            <button class="btn-default" onclick="clearChapterForm()">清空表单</button>
        </div>
        <h2 style="margin-top:30px;">已有章节列表</h2>
        <div id="chapterList"></div>
    </div>
    <!-- ========== 2.公告管理 ========== -->
    <div class="panel" id="tab-notice">
        <h2>发布新公告</h2>
        <input type="hidden" id="editNoticeId" value="">
        <label>公告标题</label>
        <input id="noticeTitle" placeholder="公告标题">
        <label>公告内容</label>
        <textarea id="noticeContent" class="big"></textarea>
        <div class="btns">
            <button class="btn-primary" onclick="saveNotice()">保存公告</button>
            <button class="btn-default" onclick="clearNoticeForm()">清空</button>
        </div>
        <h2 style="margin-top:30px;">全部公告列表</h2>
        <div id="noticeList"></div>
    </div>
    <!-- ========== 3.投稿审核 ========== -->
    <div class="panel" id="tab-submit">
        <h2>待审核用户投稿（可通过转为章节 / 驳回）</h2>
        <div id="submitList"></div>
    </div>
    <!-- ========== 4.在线用户 ========== -->
    <div class="panel" id="tab-online">
        <h2>当前在线用户（90秒无操作自动离线）</h2>
        <div id="onlineUserList"></div>
        <div class="btns" style="margin-top:15px;">
            <button class="btn-primary" onclick="loadOnlineUsers()">刷新列表</button>
        </div>
    </div>
    <!-- ========== 5.小说管理 ========== -->
    <div class="panel" id="tab-novel">
        <h2>全部小说管理（可删除违规小说）</h2>
        <div id="novelAdminList"></div>
    </div>
    <!-- ========== 6.讨论区管理 ========== -->
    <div class="panel" id="tab-discuss">
        <h2>班级讨论内容管理</h2>
        <div id="discussAdminList"></div>
    </div>
    <!-- ========== 7.日常分享管理 ========== -->
    <div class="panel" id="tab-share">
        <h2>日常分享帖子管理（帖子+评论）</h2>
        <div id="shareAdminList"></div>
    </div>
    <!-- ==========8.激活数字管理========== -->
    <div class="panel" id="tab-activate">
        <h2>🔢激活数字指令管理</h2>
        <input type="hidden" id="editActivateId" value="">
        <label>触发数字（纯数字）</label>
        <input id="actCode" type="number" placeholder="例如100">
        <label>指令描述</label>
        <input id="actDesc" placeholder="描述这个数字干什么">
        <label>行为类型</label>
        <select id="actType">
            <option value="alert">alert 弹窗提示</option>
            <option value="jump">jump 页面跳转</option>
        </select>
        <label>参数（弹窗文字 / 跳转URL）</label>
        <textarea id="actPayload" placeholder="弹窗填文字；跳转填完整url"></textarea>
        <div class="btns">
            <button class="btn-primary" onclick="saveActivateCode()">保存指令</button>
            <button class="btn-default" onclick="clearActivateForm()">清空表单</button>
        </div>
        <h2 style="margin-top:24px;">全部激活指令列表</h2>
        <div id="activateCodeList"></div>
    </div>
</div>
</div>
<script>
const SUPABASE_URL = "https://gbktpjnitqpwomcprrol.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdia3Rwam5pdHFwd29tY3Bycm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MTk2NDIsImV4cCI6MjA5ODk5NTY0Mn0.TIp9NAdDRZrI16Jq_no7Ga9EpX7ooc6b5Ck7r-sNqww";
const ADMIN_PASSWORD = "280class";
const EXTRA_PASSWORD = "hanliupiannuan";
let canAccessActivatePanel = false;

function loginCheck(){
    const input = document.getElementById("adminPwd").value;
    const tip = document.getElementById("loginTip");
    if(input === ADMIN_PASSWORD){
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("adminMain").style.display = "block";
        loadCurrentTabData();
    }else{
        tip.style.display = "block";
    }
}
document.getElementById("adminPwd").addEventListener("keydown",e=>{
    if(e.key === "Enter") loginCheck();
})

async function supabaseRequest(table, method = 'GET', data = null, id = null) {
    const url = id
        ? `${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`
        : `${SUPABASE_URL}/rest/v1/${table}`;
    const options = {
        method: method,
        headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json; charset=utf-8',
            'Prefer': 'return=representation'
        }
    };
    if (data && (method === 'POST' || method === 'PATCH')) {
        options.body = JSON.stringify(data);
    }
    try {
        const res = await fetch(url, options);
        if (method === 'DELETE') return { ok: true };
        const result = await res.json();
        return result;
    } catch (e) {
        console.error('请求失败：', e);
        alert("网络或数据库请求异常");
        return [];
    }
}

document.querySelectorAll('.tab').forEach(tab=>{
    tab.onclick = async ()=>{
        const target = tab.getAttribute("data-target");
        if(target === "tab-activate"){
            if(!canAccessActivatePanel){
                document.getElementById("activatePwdBox").style.display="flex";
                return;
            }
        }
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));
        tab.classList.add('active');
        document.getElementById(target).classList.add('show');
        await loadCurrentTabData();
    }
})

function loadCurrentTabData(){
    const activeTab = document.querySelector('.tab.active').dataset.target;
    switch(activeTab){
        case "tab-chapter": loadChapterList(); break;
        case "tab-notice": loadNoticeList(); break;
        case "tab-submit": loadSubmitList(); break;
        case "tab-online": loadOnlineUsers(); break;
        case "tab-novel": loadNovelAdminList(); break;
        case "tab-discuss": loadDiscussAdminList(); break;
        case "tab-share": loadShareAdminList(); break;
        case "tab-activate": loadActivateCodeList(); break;
    }
}

async function loadChapterList(){
    const list = await supabaseRequest("chapters");
    const wrap = document.getElementById("chapterList");
    if(!Array.isArray(list) || list.length===0){
        wrap.innerHTML = "<div class='info-text'>暂无章节</div>";
        return;
    }
    wrap.innerHTML = list.map(item=>`
    <div class="list-item">
        <h4>${escapeHtml(item.title)}</h4>
        <div class="list-actions">
            <button class="btn-primary" onclick="editChapter(${JSON.stringify(item).replace(/"/g,'&quot;')})">编辑</button>
            <button class="btn-danger" onclick="delChapter(${item.id})">删除</button>
        </div>
    </div>`).join('');
}
function clearChapterForm(){
    document.getElementById('editChapterId').value="";
    document.getElementById('chTitle').value="";
    document.getElementById('chPreface').value="";
    document.getElementById('chBody').value="";
    document.getElementById('chExercises').value="";
    document.getElementById('chExtension').value="";
}
function editChapter(data){
    document.getElementById('editChapterId').value = data.id;
    document.getElementById('chTitle').value = data.title||"";
    document.getElementById('chPreface').value = data.preface||"";
    document.getElementById('chBody').value = data.body||"";
    document.getElementById('chExercises').value = data.exercises||"";
    document.getElementById('chExtension').value = data.extension||"";
}
async function saveChapter(){
    const id = document.getElementById('editChapterId').value;
    const data = {
        title: document.getElementById('chTitle').value.trim(),
        preface: document.getElementById('chPreface').value.trim(),
        body: document.getElementById('chBody').value.trim(),
        exercises: document.getElementById('chExercises').value.trim(),
        extension: document.getElementById('chExtension').value.trim()
    }
    if(!data.title || !data.body) return alert("标题和正文不能为空");
    if(id){
        await supabaseRequest("chapters","PATCH",data,id);
        alert("修改成功");
    }else{
        await supabaseRequest("chapters","POST",data);
        alert("新增成功");
    }
    clearChapterForm();
    loadChapterList();
}
async function delChapter(id){
    if(!confirm("确认永久删除该章节？")) return;
    await supabaseRequest("chapters","DELETE",null,id);
    loadChapterList();
}

async function loadNoticeList(){
    const list = await supabaseRequest("notices");
    const wrap = document.getElementById("noticeList");
    if(!Array.isArray(list) || list.length===0){
        wrap.innerHTML = "<div class='info-text'>暂无公告</div>";
        return;
    }
    wrap.innerHTML = list.map(item=>`
    <div class="list-item">
        <h4>${escapeHtml(item.title)}</h4>
        <div class="info-text">发布日期：${item.date||""}</div>
        <div class="list-actions">
            <button class="btn-primary" onclick="editNotice(${JSON.stringify(item).replace(/"/g,'&quot;')})">编辑</button>
            <button class="btn-danger" onclick="delNotice(${item.id})">删除</button>
        </div>
    </div>`).join('');
}
function clearNoticeForm(){
    document.getElementById('editNoticeId').value="";
    document.getElementById('noticeTitle').value="";
    document.getElementById('noticeContent').value="";
}
function editNotice(data){
    document.getElementById('editNoticeId').value = data.id;
    document.getElementById('noticeTitle').value = data.title||"";
    document.getElementById('noticeContent').value = data.content||"";
}
async function saveNotice(){
    const id = document.getElementById('editNoticeId').value;
    const now = new Date().toLocaleString();
    const data = {
        title: document.getElementById('noticeTitle').value.trim(),
        content: document.getElementById('noticeContent').value.trim(),
        date: now
    }
    if(!data.title || !data.content) return alert("标题和内容不能为空");
    if(id){
        await supabaseRequest("notices","PATCH",data,id);
        alert("公告已更新");
    }else{
        await supabaseRequest("notices","POST",data);
        alert("公告发布成功");
    }
    clearNoticeForm();
    loadNoticeList();
}
async function delNotice(id){
    if(!confirm("删除这条公告？")) return;
    await supabaseRequest("notices","DELETE",null,id);
    loadNoticeList();
}

async function loadSubmitList(){
    const list = await supabaseRequest("submissions");
    const wrap = document.getElementById("submitList");
    const pending = Array.isArray(list) ? list.filter(x=>x.status==="pending") : [];
    if(pending.length===0){
        wrap.innerHTML = "<div class='info-text'>目前没有待审核投稿</div>";
        return;
    }
    wrap.innerHTML = pending.map(item=>{
        let contentObj = {};
        try{contentObj = JSON.parse(item.content);}catch(e){}
        return `
        <div class="list-item">
            <h4>投稿人：${escapeHtml(item.nickname)}</h4>
            <div class="info-text">标题：${escapeHtml(contentObj.title||"无标题")}</div>
            <pre>${escapeHtml(contentObj.body||"无正文")}</pre>
            <div class="list-actions">
                <button class="btn-success" onclick="acceptSubmit(${item.id})">✅通过（转为正式章节）</button>
                <button class="btn-danger" onclick="rejectSubmit(${item.id})">❌驳回（直接删除）</button>
            </div>
        </div>`;
    }).join('');
}
async function acceptSubmit(subId){
    if(!confirm("确认通过投稿，自动添加到历史书并删除投稿记录？")) return;
    const allSub = await supabaseRequest("submissions");
    const subItem = allSub.find(x=>x.id===subId);
    let c = {};
    try{c=JSON.parse(subItem.content);}catch(e){alert("投稿内容解析失败");return;}
    await supabaseRequest("chapters","POST",{
        title:c.title,
        preface:c.preface||"",
        body:c.body||"",
        exercises:c.exercises||"",
        extension:c.extension||""
    });
    await supabaseRequest("submissions","DELETE",null,subId);
    alert("审核通过！已生成章节");
    loadSubmitList();
}
async function rejectSubmit(subId){
    if(!confirm("确定驳回，直接删除这条投稿？")) return;
    await supabaseRequest("submissions","DELETE",null,subId);
    alert("已驳回删除");
    loadSubmitList();
}

async function loadOnlineUsers(){
    const raw = await supabaseRequest("online_users");
    const wrap = document.getElementById("onlineUserList");
    const expire = 90*1000;
    const now = Date.now();
    const active = Array.isArray(raw) ? raw.filter(u=> now-new Date(u.last_active).getTime() < expire) : [];
    if(active.length===0){
        wrap.innerHTML="<div class='info-text'>暂无在线用户</div>";
        return;
    }
    wrap.innerHTML = `<div class="info-text">在线人数：${active.length}</div>` +
        active.map(u=>`<div class="list-item">👤 ${escapeHtml(u.nickname)}</div>`).join("");
}

async function loadNovelAdminList(){
    const list = await supabaseRequest("novels");
    const wrap = document.getElementById("novelAdminList");
    if(!Array.isArray(list)||list.length===0){
        wrap.innerHTML="<div class='info-text'>暂无小说</div>";
        return;
    }
    wrap.innerHTML = list.map(item=>`
    <div class="list-item">
        <h4>${escapeHtml(item.title)}｜作者：${escapeHtml(item.author)}</h4>
        <div class="info-text">点赞：${item.likes||0}</div>
        <div class="list-actions">
            <button class="btn-danger" onclick="adminDelNovel(${item.id})">🗑️ 删除小说</button>
        </div>
    </div>`).join('');
}
async function adminDelNovel(id){
    if(!confirm("管理员删除小说，不可恢复！")) return;
    await supabaseRequest("novels","DELETE",null,id);
    loadNovelAdminList();
}

async function loadDiscussAdminList(){
    const list = await supabaseRequest("discussions");
    const wrap = document.getElementById("discussAdminList");
    if(!Array.isArray(list)||list.length===0){
        wrap.innerHTML="<div class='info-text'>暂无讨论内容</div>";
        return;
    }
    wrap.innerHTML = list.map(item=>`
    <div class="list-item">
        <h4>👤${escapeHtml(item.nickname)} ${item.created_at||""}</h4>
        <pre>${escapeHtml(item.content)}</pre>
        <div class="list-actions">
            <button class="btn-danger" onclick="adminDelDiscuss(${item.id})">🗑️ 删除这条讨论</button>
        </div>
    </div>`).join('');
}
async function adminDelDiscuss(id){
    if(!confirm("删除这条讨论？")) return;
    await supabaseRequest("discussions","DELETE",null,id);
    loadDiscussAdminList();
}

async function loadShareAdminList(){
    const posts = await supabaseRequest("posts");
    const wrap = document.getElementById("shareAdminList");
    if(!Array.isArray(posts)||posts.length===0){
        wrap.innerHTML="<div class='info-text'>暂无日常分享帖子</div>";
        return;
    }
    wrap.innerHTML = posts.map(item=>`
    <div class="list-item">
        <h4>👤${escapeHtml(item.nickname)} ${item.created_at||""}</h4>
        <pre>${escapeHtml(item.content||"无文字内容")}</pre>
        <div class="list-actions">
            <button class="btn-danger" onclick="adminDelPost(${item.id})">🗑️ 删除帖子</button>
        </div>
    </div>`).join('');
}
async function adminDelPost(id){
    if(!confirm("删除这条日常分享帖子？")) return;
    await supabaseRequest("posts","DELETE",null,id);
    loadShareAdminList();
}

//========激活数字模块密码弹窗工具函数 ========
function checkExtraPassword(){
    const inputVal = document.getElementById("extraPwdInput").value.trim();
    if(inputVal === EXTRA_PASSWORD){
        canAccessActivatePanel = true;
        document.getElementById("activatePwdBox").style.display="none";
        document.getElementById("extraPwdTip").style.display="none";
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));
        document.querySelector('.tab[data-target="tab-activate"]').classList.add("active");
        document.getElementById("tab-activate").classList.add("show");
        loadActivateCodeList();
    }else{
        document.getElementById("extraPwdTip").style.display="block";
    }
}
function closeActivatePwdBox(){
    document.getElementById("activatePwdBox").style.display="none";
    document.getElementById("extraPwdTip").style.display="none";
}

//========激活数字 CRUD 函数 ========
async function loadActivateCodeList(){
    const list = await supabaseRequest("activate_codes");
    const wrap = document.getElementById("activateCodeList");
    if(!Array.isArray(list) || list.length===0){
        wrap.innerHTML="<div class='info-text'>暂无激活指令</div>";
        return;
    }
    wrap.innerHTML = list.map(item=>`
    <div class="list-item">
        <h4>🔢数字：${escapeHtml(item.code)}｜类型：${escapeHtml(item.type)}</h4>
        <div class="info-text">说明：${escapeHtml(item.description||"无")}</div>
        <div class="info-text">参数：${escapeHtml(item.payload||"")}</div>
        <div class="list-actions">
            <button class="btn-primary" onclick="editActivate(${JSON.stringify(item).replace(/"/g,'&quot;')})">编辑</button>
            <button class="btn-danger" onclick="delActivate(${item.id})">删除</button>
        </div>
    </div>`).join('');
}
function clearActivateForm(){
    document.getElementById('editActivateId').value="";
    document.getElementById('actCode').value="";
    document.getElementById('actDesc').value="";
    document.getElementById('actType').value="alert";
    document.getElementById('actPayload').value="";
}
function editActivate(data){
    document.getElementById('editActivateId').value = data.id;
    document.getElementById('actCode').value = data.code;
    document.getElementById('actDesc').value = data.description||"";
    document.getElementById('actType').value = data.type;
    document.getElementById('actPayload').value = data.payload||"";
}
async function saveActivateCode(){
    const id = document.getElementById('editActivateId').value;
    const codeVal = Number(document.getElementById('actCode').value);
    const descVal = document.getElementById('actDesc').value.trim();
    const typeVal = document.getElementById('actType').value;
    const payloadVal = document.getElementById('actPayload').value.trim();
    if(isNaN(codeVal)){
        alert("请填写合法数字");
        return;
    }
    const data = {
        code: codeVal,
        description: descVal,
        type: typeVal,
        payload: payloadVal
    };
    if(id){
        await supabaseRequest("activate_codes","PATCH",data,Number(id));
        alert("修改成功");
    }else{
        await supabaseRequest("activate_codes","POST",data);
        alert("新增成功");
    }
    clearActivateForm();
    loadActivateCodeList();
}
async function delActivate(id){
    if(!confirm("确认删除该激活指令？")) return;
    await supabaseRequest("activate_codes","DELETE",null,id);
    loadActivateCodeList();
}

function escapeHtml(str){
    if(!str) return "";
    return String(str)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace( />/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
}
