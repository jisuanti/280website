<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账号注册</title>
<style>
:root{
    --glass-bg: rgba(255,255,255,0.6);
    --glass-border: rgba(255,255,255,0.7);
    --glass-shadow: 0 8px 40px rgba(31,38,135,0.10);
    --glass-blur: saturate(180%) blur(20px);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
    background:
        radial-gradient(circle at 10% 10%, #f6e7d6 0%, transparent 45%),
        radial-gradient(circle at 90% 20%, #e0ecf5 0%, transparent 45%),
        radial-gradient(circle at 50% 100%, #ede0d1 0%, transparent 55%),
        linear-gradient(135deg, #f0e9df 0%, #e8dfd3 100%);
    background-attachment:fixed;
}
.box{
    width:100%;max-width:420px;padding:32px;
    background:var(--glass-bg);
    backdrop-filter:var(--glass-blur);
    -webkit-backdrop-filter:var(--glass-blur);
    border:1px solid var(--glass-border);
    border-radius:24px;
    box-shadow:var(--glass-shadow);
}
h2{text-align:center;margin-bottom:24px;color:#3e2723;}
input{
    width:100%;padding:13px 16px;margin:8px 0;
    border:1px solid rgba(255,255,255,0.85);
    border-radius:14px;font-size:16px;
    background:rgba(255,255,255,0.75);outline:none;transition:.2s;
}
input:focus{border-color:rgba(141,110,99,0.55);background:rgba(255,255,255,0.95);box-shadow:0 0 0 4px rgba(141,110,99,0.10);}
button{
    width:100%;padding:14px;margin-top:12px;
    background:#8d6e63;color:#fff;border:none;border-radius:14px;
    font-size:16px;cursor:pointer;font-weight:600;transition:.2s;
    box-shadow:0 6px 18px rgba(141,110,99,0.35);
}
button:hover{background:#6d4c41;}
button:disabled{background:#bdbdbd;cursor:not-allowed;box-shadow:none;}
.tip{margin-top:16px;text-align:center;font-size:14px;color:#555;}
.tip a{color:#8d6e63;text-decoration:none;font-weight:600;}
.tip a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="box">
    <h2>新用户注册</h2>
    <input id="regUser" placeholder="登录账号（不可重复）">
    <input id="regPwd" type="password" placeholder="设置登录密码">
    <input id="regNick" placeholder="你的昵称">
    <button id="regBtn">完成注册</button>
    <div class="tip">已有账号？<a href="login.html">前往登录</a></div>
</div>

<script>
const SUPABASE_URL = 'https://gbktpjnitqpwomcprrol.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdia3Rwam5pdHFwd29tY3Bycm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MTk2NDIsImV4cCI6MjA5ODk5NTY0Mn0.TIp9NAdDRZrI16Jq_no7Ga9EpX7ooc6b5Ck7r-sNqww';

async function api(table, method, body){
    const opt = {
        method,
        headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json'
        }
    };
    if (body) opt.body = JSON.stringify(body);
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, opt);
    return await res.json();
}

document.getElementById('regBtn').onclick = async () => {
    const username = document.getElementById('regUser').value.trim();
    const password = document.getElementById('regPwd').value.trim();
    const nickname = document.getElementById('regNick').value.trim();
    if (!username || !password || !nickname) return alert('所有项目不能为空！');

    // 查询账号是否重复
    const exist = await api('users', 'GET');
    const find = Array.isArray(exist) && exist.find(u => u.username === username);
    if (find) return alert('该账号已被注册！');

    // 创建用户，last_modify_info 留空，首次无冷却
    await api('users', 'POST', {
        username,
        password,
        nickname,
        avatar: '',
        last_modify_info: null
    });
    alert('注册成功！跳转到登录页');
    location.href = 'login.html';
};
</script>
</body>
</html>
