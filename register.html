<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账号注册</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}
body{background:#f3f1ec;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;}
.box{width:100%;max-width:420px;background:#fff;padding:32px;border-radius:14px;box-shadow:0 2px 14px rgba(0,0,0,0.07);}
h2{text-align:center;margin-bottom:24px;color:#333;}
input{width:100%;padding:12px 14px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:16px;}
button{width:100%;padding:13px;background:#8d6e63;color:#fff;border:none;border-radius:8px;font-size:16px;margin-top:12px;cursor:pointer;}
.tip{margin-top:16px;text-align:center;font-size:14px;color:#555;}
.tip a{color:#8d6e63;text-decoration:none;}
</style>
</head>
<body>
<div class="box">
    <h2>新用户注册</h2>
    <input id="regUser" placeholder="登录账号（不可重复）">
    <input id="regPwd" type="password" placeholder="设置登录密码">
    <input id="regNick" placeholder="你的昵称">
    <button id="regBtn">完成注册</button>
    <div class="tip">已有账号？<a href="login.html">前往登录</a></div>
</div>

<script>
const SUPABASE_URL = 'https://gbktpjnitqpwomcprrol.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdia3Rwam5pdHFwd29tY3Bycm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MTk2NDIsImV4cCI6MjA5ODk5NTY0Mn0.TIp9NAdDRZrI16Jq_no7Ga9EpX7ooc6b5Ck7r-sNqww';

async function api(table,method,body){
    const opt={
        method,
        headers:{
            apikey:SUPABASE_KEY,
            Authorization:`Bearer ${SUPABASE_KEY}`,
            "Content-Type":"application/json"
        }
    };
    if(body) opt.body=JSON.stringify(body);
    const res=await fetch(`${SUPABASE_URL}/rest/v1/${table}`,opt);
    return await res.json();
}

document.getElementById("regBtn").onclick=async ()=>{
    const username=document.getElementById("regUser").value.trim();
    const password=document.getElementById("regPwd").value.trim();
    const nickname=document.getElementById("regNick").value.trim();
    if(!username||!password||!nickname) return alert("所有项目不能为空！");

    // 查询账号是否重复
    const exist=await api("users","GET");
    const find=exist.find(u=>u.username===username);
    if(find) return alert("该账号已被注册！");

    // 创建用户，last_modify_info留空，首次无冷却
    await api("users","POST",{
        username,password,nickname,
        avatar:"",
        last_modify_info:null
    });
    alert("注册成功！跳转到登录页");
    location.href="login.html";
}
</script>
</body>
</html>
